<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug-to-Developer Assignment Algorithm Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --highlight: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        /* Layout */
        #sidebar {
            width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            z-index: 10;
            overflow-y: auto;
        }

        #main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header / Controls */
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: var(--highlight);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        /* Flowchart */
        #flowchart {
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }
        
        .node {
            padding: 15px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .node:hover {
            transform: translateX(10px);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .node.active {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .node.active::before {
            content: '';
            position: absolute;
            left: -1px;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-green);
            border-radius: 4px 0 0 4px;
        }

        .node-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .node-content h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .node-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Arrows between nodes */
        .arrow-down {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseArrow 2s infinite;
        }

        @keyframes pulseArrow {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(5px); opacity: 1; color: var(--accent-blue); }
            100% { transform: translateY(0); opacity: 0.5; }
        }

        /* Detail Panel */
        #detail-panel {
            flex: 1;
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }
        .detail-header i {
            font-size: 2rem;
            color: var(--accent-blue);
        }

        .viz-container {
            flex: 1;
            min-height: 300px;
            position: relative;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Dynamic Utilities inside details */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        
        .tag {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin: 2px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--accent-blue); }
        
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .progress-fill { height: 100%; background: var(--accent-blue); transition: width 1s ease-in-out; }
        .progress-fill.red { background: var(--accent-red); }
        .progress-fill.green { background: var(--accent-green); }

        /* Sliders */
        .slider-group { margin-bottom: 15px; width: 100%; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        input[type=range] { width: 100%; accent-color: var(--accent-blue); }

        /* Tooltip */
        .tooltip {
            position: relative;
            cursor: help;
            border-bottom: 1px dotted var(--text-muted);
        }
        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }
        .tooltip:hover::after { opacity: 1; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid transparent;
            transition: all 0.5s;
        }
        .leaderboard-item:nth-child(1) { border-color: gold; transform: scale(1.02); background: rgba(255, 215, 0, 0.1); }
        .leaderboard-item:nth-child(2) { border-color: silver; }
        .leaderboard-item:nth-child(3) { border-color: #cd7f32; }

        /* Vector Text Parsing anim */
        .parse-box {
            display: inline-block;
            padding: 5px;
            border: 1px solid var(--accent-blue);
            margin: 2px;
            border-radius: 4px;
            animation: highlightText 2s alternate infinite;
        }
        @keyframes highlightText {
            0% { background: transparent; }
            100% { background: rgba(59, 130, 246, 0.3); }
        }

        /* Specific visualizers */
        #knn-canvas { width: 100%; height: 300px; }
        
        /* Select styling */
        select {
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 8px;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

    <div id="sidebar" class="glass" style="border-radius: 0; border-right: 1px solid var(--glass-border);">
        <header>
            <h1><i class="fa-solid fa-microchip"></i> Auto-Assign AI</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Smart Bug Routing System</p>
        </header>

        <div class="controls">
            <button id="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play"></i> Auto-Run</button>
            <button id="btn-reset" onclick="resetApp()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>

        <div id="flowchart">
            </div>
    </div>

    <div id="main-content">
        <div id="detail-panel" class="glass">
            <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--text-muted);">
                <i class="fa-solid fa-arrow-pointer" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                <h2>Select a step to explore</h2>
                <p>Click on any node in the flowchart to view the detailed algorithm mechanics.</p>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        const state = {
            currentStep: 0,
            isPlaying: false,
            playInterval: null,
            kValue: 5,
            bugType: 'critical',
            weights: { exp: 0.3, time: 0.4, suc: 0.2, load: -0.2, skill: 0.4 } // default for critical
        };

        const bugData = {
            raw: "App crashes when uploading image >5MB",
            tokens: ["App", "crash", "upload", "image", ">5MB"],
            severity: "High",
            module: "Media System",
            vector: [0.8, 0.9, 0.4, 0.2, 0.9] // Simplified 5D vector representation
        };

        const developers = [
            { id: 1, name: "Alice Chen", exp: 8, fixTime: 1.5, success: 98, workload: 85, skill: 95, tags: ["crash", "memory"] },
            { id: 2, name: "Bob Smith", exp: 4, fixTime: 4.0, success: 82, workload: 30, skill: 70, tags: ["ui", "css"] },
            { id: 3, name: "Charlie Davis", exp: 2, fixTime: 6.5, success: 75, workload: 10, skill: 55, tags: ["upload", "api"] },
            { id: 4, name: "Diana Prince", exp: 6, fixTime: 2.2, success: 92, workload: 45, skill: 88, tags: ["image", "crash"] },
            { id: 5, name: "Evan Wright", exp: 9, fixTime: 1.8, success: 95, workload: 95, skill: 92, tags: ["system", "db"] }
        ];

        const steps = [
            { id: 1, title: "Feature Extraction", desc: "NLP parsing of bug report", icon: "fa-solid fa-language" },
            { id: 2, title: "Similarity Search", desc: "KNN vector space mapping", icon: "fa-solid fa-network-wired" },
            { id: 3, title: "Candidate Filtering", desc: "Pool generation & constraints", icon: "fa-solid fa-users-viewfinder" },
            { id: 4, title: "Attribute Matrix", desc: "Fetch historical metrics", icon: "fa-solid fa-chart-radar" },
            { id: 5, title: "AI Weighting", desc: "Dynamic contextual weights", icon: "fa-solid fa-brain" },
            { id: 6, title: "WSM Calculation", desc: "Weighted Sum Model scoring", icon: "fa-solid fa-calculator" },
            { id: 7, title: "Developer Ranking", desc: "Sort by computed utility", icon: "fa-solid fa-sort-amount-down" },
            { id: 8, title: "Final Assignment", desc: "Optimal routing decision", icon: "fa-solid fa-check-circle" }
        ];

        let radarChartInstance = null;
        let wsmChartInstance = null;

        // --- INITIALIZATION ---
        function init() {
            renderFlowchart();
        }

        function renderFlowchart() {
            const container = document.getElementById('flowchart');
            container.innerHTML = '';
            
            steps.forEach((step, index) => {
                const node = document.createElement('div');
                node.className = `node glass ${state.currentStep === step.id ? 'active' : ''}`;
                node.id = `node-${step.id}`;
                node.onclick = () => loadStep(step.id);
                
                node.innerHTML = `
                    <div class="node-icon"><i class="${step.icon}"></i></div>
                    <div class="node-content">
                        <h3>${index + 1}. ${step.title}</h3>
                        <p>${step.desc}</p>
                    </div>
                `;
                container.appendChild(node);

                if (index < steps.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow-down';
                    arrow.innerHTML = '<i class="fa-solid fa-chevron-down"></i>';
                    container.appendChild(arrow);
                }
            });
        }

        // --- STEP LOGIC ---
        function loadStep(stepId) {
            state.currentStep = stepId;
            renderFlowchart();
            
            const panel = document.getElementById('detail-panel');
            panel.innerHTML = '';
            panel.classList.remove('fade-in');
            void panel.offsetWidth; // trigger reflow
            panel.classList.add('fade-in');

            const stepData = steps.find(s => s.id === stepId);
            
            let content = `
                <div class="detail-header">
                    <i class="${stepData.icon}"></i>
                    <div>
                        <h2 style="font-size: 1.8rem; margin-bottom: 5px;">Step ${stepId}: ${stepData.title}</h2>
                        <p style="color: var(--text-muted);">${stepData.desc}</p>
                    </div>
                </div>
                <div class="viz-container" id="viz-area"></div>
                <div class="explanation-area" id="exp-area" style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; margin-top: auto;"></div>
            `;
            
            panel.innerHTML = content;
            renderStepVisualization(stepId);
        }

        function renderStepVisualization(stepId) {
            const viz = document.getElementById('viz-area');
            const exp = document.getElementById('exp-area');

            switch(stepId) {
                case 1:
                    viz.innerHTML = `
                        <div style="text-align: left; width: 100%; max-width: 600px;">
                            <h3 style="margin-bottom: 10px; color: var(--accent-blue);">Incoming Bug Report</h3>
                            <div class="glass" style="padding: 15px; margin-bottom: 20px;">
                                <p style="font-size: 1.2rem;">"${bugData.raw.split(' ').map(w => `<span class="parse-box">${w}</span>`).join(' ')}"</p>
                            </div>
                            <div class="grid-2">
                                <div>
                                    <h4>Extracted Metadata</h4>
                                    <ul style="list-style-type: none; margin-top: 10px;">
                                        <li><i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red);"></i> Severity: ${bugData.severity}</li>
                                        <li><i class="fa-solid fa-layer-group" style="color:var(--accent-blue);"></i> Module: ${bugData.module}</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4>NLP Tokens (TF-IDF)</h4>
                                    <div style="margin-top: 10px;">
                                        ${bugData.tokens.map(t => `<span class="tag">${t}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div style="margin-top: 20px;">
                                <h4>Vector Representation</h4>
                                <p style="font-family: monospace; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; color: var(--accent-green);">
                                    V_bug = [${bugData.vector.join(', ')}]
                                </p>
                            </div>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> The system uses Natural Language Processing (BERT/TF-IDF) to convert the raw bug description into a high-dimensional vector. Metadata (severity, module) is parsed to adjust initial routing constraints.`;
                    break;

                case 2:
                    viz.innerHTML = `
                        <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h3><span class="tooltip" data-tip="K-Nearest Neighbors">KNN</span> Vector Space</h3>
                                <div>
                                    <label>K Value: <span id="k-val-display">${state.kValue}</span></label>
                                    <input type="range" min="1" max="10" value="${state.kValue}" oninput="document.getElementById('k-val-display').innerText = this.value; state.kValue = parseInt(this.value); drawKNN();">
                                </div>
                            </div>
                            <canvas id="knn-canvas" style="flex: 1; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px dashed var(--glass-border);"></canvas>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> The algorithm computes the <span class="tooltip" data-tip="sim(A,B) = (A·B) / (||A|| ||B||)">Cosine Similarity</span> between the new bug vector and historically resolved bugs. It retrieves the 'K' most similar historical bugs to identify which developers successfully fixed them.`;
                    setTimeout(drawKNN, 100);
                    break;

                case 3:
                    let devsHTML = developers.map(d => `
                        <tr>
                            <td><i class="fa-solid fa-user-circle" style="color: var(--accent-blue); font-size: 1.2rem; margin-right: 8px;"></i> ${d.name}</td>
                            <td>${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</td>
                            <td>
                                <div style="display:flex; justify-content: space-between; font-size: 0.8rem;">
                                    <span>${d.workload}%</span>
                                    <span>${d.workload > 80 ? 'Busy' : 'Available'}</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill ${d.workload > 80 ? 'red' : 'green'}" style="width: ${d.workload}%;"></div>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                    viz.innerHTML = `
                        <div style="width: 100%;">
                            <h3>Candidate Developer Pool</h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Extracted from K-similar historical bugs.</p>
                            <table>
                                <tr><th>Developer</th><th>Matched Skills</th><th>Current Workload</th></tr>
                                ${devsHTML}
                            </table>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> From the 'K' historical bugs, the system extracts the developers who resolved them. A preliminary hard-filter is applied (e.g., removing developers on PTO or with >95% workload).`;
                    break;

                case 4:
                    viz.innerHTML = `
                        <div class="grid-2" style="height: 100%; align-items: center;">
                            <div style="width: 100%; height: 300px;">
                                <canvas id="radar-chart"></canvas>
                            </div>
                            <div>
                                <h3>Attribute Matrix Definition</h3>
                                <table style="font-size: 0.8rem;">
                                    <tr><th>Attribute</th><th>Type</th><th>Ideal</th></tr>
                                    <tr><td>Experience</td><td>Benefit</td><td>High</td></tr>
                                    <tr><td>Fix Time</td><td>Cost</td><td>Low</td></tr>
                                    <tr><td>Success Rate</td><td>Benefit</td><td>High</td></tr>
                                    <tr><td>Workload</td><td>Cost</td><td>Low</td></tr>
                                    <tr><td>Expertise (Bug Specific)</td><td>Benefit</td><td>High</td></tr>
                                </table>
                            </div>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> For each candidate, an attribute vector is constructed. <span class="tooltip" data-tip="Higher is better">Benefit criteria</span> (Experience, Success Rate) are maximized, while <span class="tooltip" data-tip="Lower is better">Cost criteria</span> (Fix Time, Workload) are minimized.`;
                    setTimeout(drawRadar, 100);
                    break;

                case 5:
                    viz.innerHTML = `
                        <div style="width: 100%; max-width: 500px; text-align: left;">
                            <h3>Dynamic AI Weight Assignment</h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">Select context to see AI adjust weights automatically.</p>
                            
                            <select id="bug-type" onchange="updateWeights(this.value)">
                                <option value="critical" ${state.bugType === 'critical' ? 'selected' : ''}>Critical Hotfix (Priority: Speed & Skill)</option>
                                <option value="minor" ${state.bugType === 'minor' ? 'selected' : ''}>Minor UI Bug (Priority: Low Workload/Junior)</option>
                                <option value="complex" ${state.bugType === 'complex' ? 'selected' : ''}>Complex Core Feature (Priority: Experience & Success)</option>
                            </select>

                            <div class="slider-group">
                                <label>Experience (W1) <span id="w-exp">${state.weights.exp.toFixed(2)}</span></label>
                                <input type="range" id="sl-exp" min="0" max="1" step="0.05" value="${state.weights.exp}" disabled>
                            </div>
                            <div class="slider-group">
                                <label>Speed / Fix Time (W2) <span id="w-time">${state.weights.time.toFixed(2)}</span></label>
                                <input type="range" id="sl-time" min="0" max="1" step="0.05" value="${state.weights.time}" disabled>
                            </div>
                            <div class="slider-group">
                                <label>Success Rate (W3) <span id="w-suc">${state.weights.suc.toFixed(2)}</span></label>
                                <input type="range" id="sl-suc" min="0" max="1" step="0.05" value="${state.weights.suc}" disabled>
                            </div>
                            <div class="slider-group">
                                <label>Workload Penalty (W4) <span id="w-load">${state.weights.load.toFixed(2)}</span></label>
                                <input type="range" id="sl-load" min="-1" max="0" step="0.05" value="${state.weights.load}" disabled>
                            </div>
                            <div class="slider-group">
                                <label>Domain Skill (W5) <span id="w-skill">${state.weights.skill.toFixed(2)}</span></label>
                                <input type="range" id="sl-skill" min="0" max="1" step="0.05" value="${state.weights.skill}" disabled>
                            </div>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> A secondary AI model analyzes the bug metadata to assign weights ($W_j$) to each attribute. A critical crash heavily weights Speed and Domain Skill, whereas a minor bug might prioritize developers with low workloads to balance team health.`;
                    break;

                case 6:
                    viz.innerHTML = `
                        <div style="width: 100%;">
                            <h3 style="margin-bottom: 10px;">Weighted Sum Model (WSM) Matrix</h3>
                            <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-family: monospace; text-align: center; color: var(--accent-green);">
                                Score = (W_exp × Exp) - (W_time × Time) + (W_suc × Suc) - (|W_load| × Load) + (W_skill × Skill)
                            </div>
                            <div style="overflow-x: auto;">
                                <table id="wsm-table">
                                    <tr>
                                        <th>Dev</th>
                                        <th>Exp (+${state.weights.exp})</th>
                                        <th>Time (-${state.weights.time})</th>
                                        <th>Suc (+${state.weights.suc})</th>
                                        <th>Load (${state.weights.load})</th>
                                        <th>Skill (+${state.weights.skill})</th>
                                        <th>Raw Score</th>
                                    </tr>
                                    </table>
                            </div>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> Multi-Criteria Decision Making (MCDM). Attributes are normalized ($x_{ij}$) and multiplied by dynamic weights ($w_j$). The formula $A_i^{WSM} = \\sum_{j=1}^{n} w_j x_{ij}$ computes the overall utility score for each developer.`;
                    populateWSMTable();
                    break;

                case 7:
                    const scoredDevs = calculateScores();
                    let rankHTML = scoredDevs.map((d, i) => `
                        <div class="leaderboard-item fade-in" style="animation-delay: ${i * 0.2}s">
                            <div>
                                <strong style="font-size: 1.2rem; color: ${i===0?'gold':i===1?'silver':i===2?'#cd7f32':'var(--text-main)'}; margin-right: 10px;">#${i+1}</strong>
                                <span>${d.name}</span>
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-solid fa-briefcase"></i> Load: ${d.workload}%</span>
                                <span style="font-weight: bold; color: var(--accent-blue); background: rgba(59, 130, 246, 0.2); padding: 4px 10px; border-radius: 20px;">Score: ${d.score.toFixed(2)}</span>
                            </div>
                        </div>
                    `).join('');
                    
                    viz.innerHTML = `
                        <div style="width: 100%; max-width: 600px;">
                            <h3 style="margin-bottom: 20px; text-align: center;">Utility Ranking</h3>
                            ${rankHTML}
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> Developers are sorted descending by their WSM score. The top-ranked developer represents the mathematical optimum for resolving the specific bug under current constraints.`;
                    break;

                case 8:
                    const winner = calculateScores()[0];
                    viz.innerHTML = `
                        <div style="text-align: center; animation: pulseArrow 2s infinite;">
                            <i class="fa-solid fa-trophy" style="font-size: 4rem; color: gold; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,215,0,0.5);"></i>
                            <h2 style="font-size: 2rem; margin-bottom: 10px; color: var(--accent-green);">Assignment Complete</h2>
                            <div class="glass" style="display: inline-block; padding: 20px 40px; margin-top: 10px; border-color: var(--accent-green);">
                                <h3 style="font-size: 1.5rem; margin-bottom: 5px;">${winner.name}</h3>
                                <p style="color: var(--text-muted); margin-bottom: 15px;">Assigned via AI Auto-Router</p>
                                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                                    <span class="tag"><i class="fa-solid fa-bolt"></i> Fast Fix Time (${winner.fixTime}h)</span>
                                    <span class="tag"><i class="fa-solid fa-brain"></i> High Expertise (${winner.skill}%)</span>
                                </div>
                            </div>
                            <p style="margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
                                Reason: Highest utility score (${winner.score.toFixed(2)}) based on ${state.bugType} bug context weighting.
                            </p>
                        </div>
                    `;
                    exp.innerHTML = `<strong>Mechanism:</strong> The system automatically creates a Jira/GitHub ticket assignment, notifies the developer via Slack, and updates their projected workload in the system matrix.`;
                    break;
            }
        }

        // --- SPECIFIC VIZ FUNCTIONS ---

        function drawKNN() {
            const canvas = document.getElementById('knn-canvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.parentElement.clientWidth;
            const h = canvas.height = 300;
            
            ctx.clearRect(0, 0, w, h);
            
            // Draw Target Bug
            const target = { x: w/2, y: h/2 };
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(target.x, target.y, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.fillText("New Bug", target.x + 15, target.y + 5);
            ctx.shadowBlur = 0;

            // Generate fake historical bugs
            Math.seedrandom = 42; // pseudo-static for visualization
            const pts = [];
            for(let i=0; i<30; i++) {
                const dist = 20 + Math.random() * 150;
                const angle = Math.random() * Math.PI * 2;
                pts.push({
                    x: target.x + Math.cos(angle) * dist,
                    y: target.y + Math.sin(angle) * dist,
                    dist: dist
                });
            }
            
            pts.sort((a,b) => a.dist - b.dist);
            
            // Draw points & connections
            pts.forEach((p, i) => {
                const isK = i < state.kValue;
                
                if(isK) {
                    ctx.beginPath();
                    ctx.moveTo(target.x, target.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.strokeStyle = `rgba(59, 130, 246, ${1 - p.dist/200})`;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, isK ? 5 : 3, 0, Math.PI*2);
                ctx.fillStyle = isK ? '#3b82f6' : 'rgba(148, 163, 184, 0.5)';
                ctx.fill();
            });
            
            // Draw K radius circle
            if(pts.length >= state.kValue) {
                const radius = pts[state.kValue-1].dist + 5;
                ctx.beginPath();
                ctx.arc(target.x, target.y, radius, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
                ctx.lineWidth = 1;
                ctx.fillStyle = 'rgba(59, 130, 246, 0.05)';
                ctx.fill();
                ctx.stroke();
            }
        }

        function drawRadar() {
            const ctx = document.getElementById('radar-chart');
            if(!ctx) return;
            if(radarChartInstance) radarChartInstance.destroy();

            // Normalize data 0-100 for visual consistency
            const maxFixTime = Math.max(...developers.map(d => d.fixTime));
            
            const datasets = developers.slice(0, 3).map((d, i) => { // show only top 3 to avoid clutter
                const colors = ['rgba(59, 130, 246, 0.5)', 'rgba(16, 185, 129, 0.5)', 'rgba(139, 92, 246, 0.5)'];
                const borders = ['#3b82f6', '#10b981', '#8b5cf6'];
                return {
                    label: d.name,
                    data: [
                        (d.exp / 10) * 100, // normalized exp
                        100 - ((d.fixTime / maxFixTime) * 100), // inverted fix time (faster is better for graph)
                        d.success,
                        100 - d.workload, // inverted workload (less is better for graph)
                        d.skill
                    ],
                    backgroundColor: colors[i],
                    borderColor: borders[i],
                    borderWidth: 1,
                    pointBackgroundColor: borders[i]
                };
            });

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Experience', 'Speed (Inv)', 'Success Rate', 'Availability', 'Domain Skill'],
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#94a3b8', font: { size: 12 } },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' }, position: 'right' }
                    }
                }
            });
        }

        function updateWeights(type) {
            state.bugType = type;
            let targetWeights;
            if(type === 'critical') targetWeights = { exp: 0.3, time: 0.5, suc: 0.2, load: -0.1, skill: 0.5 };
            if(type === 'minor') targetWeights = { exp: 0.1, time: 0.1, suc: 0.1, load: -0.6, skill: 0.2 };
            if(type === 'complex') targetWeights = { exp: 0.5, time: 0.1, suc: 0.4, load: -0.2, skill: 0.4 };
            
            // Animate sliders
            const animateSlider = (key, target) => {
                const el = document.getElementById(`sl-${key}`);
                const txt = document.getElementById(`w-${key}`);
                let current = parseFloat(el.value);
                const step = (target - current) / 10;
                let iter = 0;
                const int = setInterval(() => {
                    current += step;
                    el.value = current;
                    txt.innerText = current.toFixed(2);
                    iter++;
                    if(iter >= 10) {
                        clearInterval(int);
                        state.weights[key] = target;
                        el.value = target;
                        txt.innerText = target.toFixed(2);
                    }
                }, 30);
            };

            Object.keys(targetWeights).forEach(k => animateSlider(k, targetWeights[k]));
        }

        function calculateScores() {
            const w = state.weights;
            // Min/Max for normalization
            const maxExp = Math.max(...developers.map(d => d.exp));
            const maxTime = Math.max(...developers.map(d => d.fixTime));
            const maxSuc = Math.max(...developers.map(d => d.success));
            const maxLoad = Math.max(...developers.map(d => d.workload));
            const maxSkill = Math.max(...developers.map(d => d.skill));

            return developers.map(d => {
                // Normalize 0-1
                const nExp = d.exp / maxExp;
                const nTime = d.fixTime / maxTime;
                const nSuc = d.success / maxSuc;
                const nLoad = d.workload / maxLoad;
                const nSkill = d.skill / maxSkill;

                // Score formula
                const score = (w.exp * nExp) - (w.time * nTime) + (w.suc * nSuc) + (w.load * nLoad) + (w.skill * nSkill);
                return { ...d, score: score * 100 }; // scale to 100
            }).sort((a,b) => b.score - a.score);
        }

        function populateWSMTable() {
            const table = document.getElementById('wsm-table');
            if(!table) return;
            
            const maxTime = Math.max(...developers.map(d => d.fixTime));
            const maxExp = Math.max(...developers.map(d => d.exp));

            let html = table.innerHTML;
            developers.forEach(d => {
                const nExp = (d.exp / maxExp).toFixed(2);
                const nTime = (d.fixTime / maxTime).toFixed(2);
                const nSuc = (d.success / 100).toFixed(2);
                const nLoad = (d.workload / 100).toFixed(2);
                const nSkill = (d.skill / 100).toFixed(2);

                const rawScore = (
                    (state.weights.exp * nExp) - 
                    (state.weights.time * nTime) + 
                    (state.weights.suc * nSuc) + 
                    (state.weights.load * nLoad) + 
                    (state.weights.skill * nSkill)
                ) * 100;

                html += `
                    <tr>
                        <td><strong>${d.name}</strong></td>
                        <td>${nExp}</td>
                        <td style="color:var(--accent-red);">${nTime}</td>
                        <td>${nSuc}</td>
                        <td style="color:var(--accent-red);">${nLoad}</td>
                        <td>${nSkill}</td>
                        <td><strong style="color:var(--accent-green);">${rawScore.toFixed(2)}</strong></td>
                    </tr>
                `;
            });
            table.innerHTML = html;
        }

        // --- GLOBAL CONTROLS ---
        function togglePlay() {
            const btn = document.getElementById('btn-play');
            if(state.isPlaying) {
                clearInterval(state.playInterval);
                state.isPlaying = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Auto-Run';
                btn.style.color = "var(--text-main)";
            } else {
                state.isPlaying = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                btn.style.color = "var(--accent-green)";
                
                if(state.currentStep === 8) state.currentStep = 0; // reset if at end
                
                if(state.currentStep === 0) loadStep(1);
                
                state.playInterval = setInterval(() => {
                    if(state.currentStep < 8) {
                        loadStep(state.currentStep + 1);
                    } else {
                        togglePlay(); // auto stop at end
                    }
                }, 4000); // 4 seconds per step
            }
        }

        function resetApp() {
            if(state.isPlaying) togglePlay();
            state.currentStep = 0;
            state.kValue = 5;
            state.bugType = 'critical';
            state.weights = { exp: 0.3, time: 0.4, suc: 0.2, load: -0.2, skill: 0.4 };
            init();
            document.getElementById('detail-panel').innerHTML = `
                <div style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--text-muted);">
                    <i class="fa-solid fa-arrow-pointer" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                    <h2>System Reset Complete</h2>
                    <p>Click on any node in the flowchart to start.</p>
                </div>
            `;
        }

        // Run on load
        window.onload = init;

    </script>
</body>
